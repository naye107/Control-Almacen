services:
  - type: web
    name: japurima-almacen
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: APP_USER
        sync: false
      - key: APP_PASSWORD
        sync: false
